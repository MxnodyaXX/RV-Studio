# Minimal Supabase CLI config for local development (`supabase start`).
project_id = "rv-business-hub"

[api]
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password"]
# No public registration: the single administrator is created by the owner.
enable_signup = false
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
